name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Update source, deps, and database on server
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -eu <<'REMOTE'
            cd /home/grammble/grammble
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm exec prisma generate
            pnpm exec prisma migrate deploy
          REMOTE

      - name: Ship built assets
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/grammble/grammble/dist/"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            sudo systemctl restart grammble

      - name: Health check
        run: |
          sleep 8
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://grammble.com/api/health || true)
            if [ "$code" = "200" ]; then echo "Health OK"; exit 0; fi
            echo "Attempt $i: HTTP $code, retrying..."; sleep 5
          done
          echo "Health check failed"; exit 1
